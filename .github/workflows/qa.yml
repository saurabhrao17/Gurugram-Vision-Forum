name: QA

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly at 22:30 UTC (04:00 IST): the same checks plus the external link check.
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  checks:
    name: Unit, smoke${{ github.event_name == 'schedule' && ' and links' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        id: unit
        run: npm test 2>&1 | tee unit.log
        shell: bash

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke test
        id: smoke
        run: node tests/smoke.mjs 2>&1 | tee smoke.log
        shell: bash

      - name: Link check from this runner (informational: India-only hosts refuse foreign IPs)
        id: links
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/check-links.mjs 2>&1 | tee links.log || true
        shell: bash

      - name: Production upkeep check (the midnight-IST link run from Mumbai, cron freshness, database)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/check-health.mjs https://gurugramvisionforum.org 2>&1 | tee health.log
        shell: bash

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-logs-${{ github.run_id }}
          path: |
            unit.log
            smoke.log
            links.log
            health.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Open or update the "Nightly checks failed" issue
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const title = "Nightly checks failed";
            const read = (f) => { try { return fs.readFileSync(f, "utf8"); } catch { return ""; } };
            const tail = (s, n) => { const lines = s.trim().split("\n"); return lines.slice(-n).join("\n"); };
            const sections = [["Unit tests", "unit.log"], ["Smoke test", "smoke.log"], ["Link check", "links.log"]]
              .map(([name, file]) => ({ name, text: read(file) }))
              .filter((s) => s.text);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let body = `Nightly QA failed on ${new Date().toISOString().slice(0, 10)} for \`${context.sha.slice(0, 7)}\`.\n\nRun: ${runUrl}\n`;
            for (const s of sections) {
              let text = tail(s.text, 120);
              if (text.length > 12000) text = text.slice(-12000);
              body += `\n<details><summary>${s.name}</summary>\n\n\`\`\`\n${text}\n\`\`\`\n\n</details>\n`;
            }
            if (body.length > 60000) body = body.slice(0, 60000) + "\n…(truncated)";
            const { data: open } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "nightly-qa", per_page: 20 });
            const existing = open.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body: `Failed again: ${runUrl}` });
            } else {
              try { await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name: "nightly-qa", color: "B60205", description: "Opened by the nightly QA workflow" }); } catch {}
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ["nightly-qa"] });
            }

      - name: Close the "Nightly checks failed" issue when green
        if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/github-script@v7
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "nightly-qa", per_page: 20 });
            for (const i of open.filter((i) => i.title === "Nightly checks failed")) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: i.number, body: `Nightly checks passed again: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: i.number, state: "closed", state_reason: "completed" });
            }

name: Nightly SEO audit

# Runs the SEO steps of the daily cron against production at 03:00 IST
# (21:30 UTC): the on-page audit, link crawl and site checks (seo), one
# PageSpeed Insights run (vitals), the news search for the Forum's name
# (mentions), the AI answer check (geo), and the Search Console (gsc) and
# Bing Webmaster (bing) data pulls, then the topic pipeline (topics: drafts
# one post a night for the most discussed uncovered topic, within the weekly
# limit; it publishes after the review window unless held).
# Each step is its own call because the Vercel function has 60 seconds and
# PageSpeed alone can use most of it. The Hobby plan allows two Vercel crons
# (fetch, analyse), so this one lives here; the audit and the mentions
# search also ride the midnight fetch cron, so only the Core Web Vitals
# step depends on this workflow. Needs the repository secret CRON_SECRET
# (the same value as in Vercel); the results show on the desk's SEO tab.
on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Site origin"
        required: false
        default: "https://gurugramvisionforum.org"
      steps:
        description: "Steps to call, in order (blank = the nightly list). A step may repeat, e.g. \"geo geo geo\" asks nine AI-answer questions."
        required: false
        default: ""
      google_now:
        description: "Ask Google's AI one question now, even if it refused within the last day (after switching billing on)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Call the SEO steps one by one
        env:
          TOKEN: ${{ secrets.CRON_SECRET }}
          BASE_URL: ${{ github.event.inputs.base_url || 'https://gurugramvisionforum.org' }}
          ASKED: ${{ github.event.inputs.steps || '' }}
          GOOGLE_NOW: ${{ github.event.inputs.google_now || 'false' }}
        run: |
          if [ -z "$TOKEN" ]; then echo "CRON_SECRET repository secret is not set"; exit 1; fi
          echo "::add-mask::$TOKEN"
          ok=1
          # geo three times, a minute apart: Groq's free plan allows about
          # one web-search answer a minute, so each call answers one or two.
          steps="seo vitals mentions geo geo geo gsc bing topics"
          # The GEO and search-data steps exist only once the live site runs
          # the code that serves /llms.txt; until a deploy lands, ask only for
          # the steps every version knows (an older deploy treated unknown
          # step names as "run everything").
          llms=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' "$BASE_URL/llms.txt" || echo 000)
          if [ "$llms" != "200" ]; then
            steps="seo vitals mentions"
            echo "::notice::$BASE_URL/llms.txt answered $llms, so the live deploy predates the GEO and search-data steps; running seo, vitals and mentions only."
          fi
          # A manual run may name its own steps (known names only).
          if [ -n "$ASKED" ]; then
            steps=$(echo "$ASKED" | tr -c 'a-z \n' ' ')
            echo "::notice::Manual run: $steps"
          fi
          prev=""
          for step in $steps; do
            if [ "$step" = "geo" ] && [ "$prev" = "geo" ]; then sleep 65; fi
            prev="$step"
            extra=""
            if [ "$step" = "geo" ] && [ "$GOOGLE_NOW" = "true" ]; then extra="&google=now"; GOOGLE_NOW=done; fi
            code=$(curl -sS -m 90 -o out.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$BASE_URL/api/cron/daily?steps=$step$extra")
            echo "$step: HTTP $code"
            if command -v jq >/dev/null && jq . out.json >/dev/null 2>&1; then jq ".$step, .errors" out.json; else cat out.json; echo; fi
            { echo "## SEO step: $step"; echo; echo "HTTP $code"; echo; echo '```json'; cat out.json; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            [ "$code" = "200" ] || ok=0
          done
          [ "$ok" = "1" ]

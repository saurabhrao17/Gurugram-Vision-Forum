name: Uptime

# Every 30 minutes: the home page and the API must answer. On failure an
# "Site down" issue is opened (GitHub emails the owner); it closes itself when
# the site is back. Pair this with a free external monitor (UptimeRobot or
# Better Stack, 5-minute checks with SMS) for faster alerts.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  probe:
    name: Home page and API answer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe
        id: probe
        shell: bash
        run: |
          set +e
          fail=0
          probe() {
            url="$1"; want="$2"
            for i in 1 2 3; do
              code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 20 -A 'GurugramVisionForumBot/1.0 (+https://gurugramvisionforum.org)' "$url")
              if [ "$code" = "200" ] && grep -q "$want" /tmp/body; then echo "ok   $url ($code)"; return 0; fi
              echo "retry $i: $url answered $code"; sleep 15
            done
            echo "FAIL $url ($code)"; return 1
          }
          probe "https://gurugramvisionforum.org/" "Gurugram Vision Forum" || fail=1
          probe "https://gurugramvisionforum.org/api/health" '"ok"' || fail=1
          probe "https://gurugramvisionforum.org/ward/1" "Ward 1" || fail=1
          exit $fail

      - name: Open or update the "Site down" issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Site down: gurugramvisionforum.org is not answering";
            const body = `The uptime probe failed at ${new Date().toISOString()} (run ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).\n\nChecks: home page, /api/health, /ward/1. Look at Vercel (deployment status, function logs) and Supabase (project status) first.`;
            const { data: open } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "uptime" });
            if (open.length) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: open[0].number, body: `Still down at ${new Date().toISOString()}.` });
            } else {
              try { await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name: "uptime", color: "B60205", description: "The site or API did not answer" }); } catch {}
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ["uptime"] });
            }

      - name: Close the "Site down" issue when back
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "uptime" });
            for (const i of open) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: i.number, body: `Back up at ${new Date().toISOString()}.` });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: i.number, state: "closed", state_reason: "completed" });
            }
